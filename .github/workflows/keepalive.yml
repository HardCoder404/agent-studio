name: keep-demo-awake

# Free hosting tiers sleep after ~15 minutes idle. A ping every 10 minutes keeps the demo
# responsive during the day; it is skipped at night (IST) to stay inside free hours.
on:
  schedule:
    - cron: "*/10 2-18 * * *"   # 07:30–23:30 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_API_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.DEMO_API_URL }}/health" || echo "api asleep or down"
